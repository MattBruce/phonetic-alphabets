<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Phonetic Alphabets</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="index.css?b=20260718" type="text/css">
    <script type="module" src="index.js?b=20260718"></script>
</head>

<body class="light_or_dark_here">
    <div id="modeSelector" class="mode-selector-container">
        <div class="radio-group" style="display:none;">
            <label><input type="radio" name="mode" value="standard" checked />NATO</label>
            <label><input type="radio" name="mode" value="hipster" />Hipster ☕</label>
            <label><input type="radio" name="mode" value="business" />Business 💼</label>
            <label><input type="radio" name="mode" value="office" />Office 📎</label>
            <label><input type="radio" name="mode" value="brainrot" />Brainrot 💀</label>
            <label><input type="radio" name="mode" value="insta" />Insta 💖</label>
            <label><input type="radio" name="mode" value="techbro" />Techbro 🚀</label>
            <label><input type="radio" name="mode" value="cursed" />Cursed 👹</label>
        </div>
        <button type="button" id="modeSelectorTrigger" class="mode-selector-btn" aria-label="Select mode">
            <span id="modeSelectorLabel" class="mode-label">NATO 🪖</span>
            <span class="mode-arrow">▾</span>
        </button>
        <div id="modeBubblesOverlay" class="mode-bubbles-overlay">
            <div class="mode-bubbles-backdrop"></div>
            <div id="modeBubblesContainer" class="mode-bubbles-container"></div>
        </div>
    </div>
    <section>
        <div id="container"></div>
        <div id="inputrow"><input id="input" type="text" placeholder="Type something...">
        </div>
        <label id="punctrow"><input id="punct" type="checkbox"> Include punctuation</label>
        <div id="outputrow"><output id="output"></output><span id="speak">🔊</span></div>
    </section>
    <div id="toast" class="toast"></div>
</body>

</html>
